<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ration Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F4EE;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --text: #1A1714;
    --text2: #6B6560;
    --text3: #A09990;
    --accent: #C94B2A;
    --accent-soft: #FAF0EC;
    --accent-mid: #EDCFC6;
    --green: #3B6D11;
    --green-soft: #EAF3DE;
    --amber: #854F0B;
    --amber-soft: #FAEEDA;
    --red-soft: #FCEBEB;
    --red: #A32D2D;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ---- HEADER ---- */
  .header {
    background: var(--accent);
    padding: 28px 20px 36px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    top: -60px; right: -40px;
  }
  .header::after {
    content: '';
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    bottom: -30px; left: 60px;
  }
  .header-inner { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand-icon {
    width: 38px; height: 38px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-icon i { font-size: 20px; color: white; }
  .brand h1 { font-family: 'DM Serif Display', serif; font-size: 22px; color: white; font-weight: 400; letter-spacing: -0.3px; }
  .brand p { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 1px; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-card {
    background: rgba(255,255,255,0.12);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    backdrop-filter: blur(10px);
  }
  .stat-label { font-size: 11px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .stat-value { font-size: 26px; font-weight: 600; color: white; line-height: 1; }
  .stat-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; }

  /* ---- MAIN ---- */
  .main { max-width: 600px; margin: 0 auto; padding: 0 16px; }

  /* ---- ADD CARD ---- */
  .add-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-top: -16px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .add-card-title {
    font-size: 13px; font-weight: 500; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .add-card-title i { font-size: 15px; color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; font-weight: 500; }
  .field input, .field select {
    width: 100%; padding: 10px 12px; font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201,75,42,0.12);
  }
  .name-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: flex-end; }
  .add-btn {
    background: var(--accent); color: white;
    border: none; border-radius: var(--radius-sm);
    padding: 10px 18px; font-size: 14px; font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: 0.88; }
  .add-btn:active { transform: scale(0.97); }
  .add-btn i { font-size: 16px; }

  /* ---- QUICK PILLS ---- */
  .quick-section { margin-bottom: 20px; }
  .section-label {
    font-size: 11px; font-weight: 500; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.07em;
    margin-bottom: 8px;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    border-radius: 999px; padding: 5px 14px;
    font-size: 13px; color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: all 0.15s;
  }
  .pill:hover { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent); }

  /* ---- LIST SECTION ---- */
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .list-head .section-label { margin-bottom: 0; }
  .filter-wrap { display: flex; gap: 6px; align-items: center; }
  .filter-input {
    font-size: 13px; padding: 6px 10px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-family: 'DM Sans', sans-serif;
  }
  .filter-input:focus { border-color: var(--accent); }
  .clear-filter-btn {
    width: 32px; height: 32px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    border-radius: var(--radius-sm);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text2); transition: all 0.15s;
  }
  .clear-filter-btn:hover { background: var(--red-soft); color: var(--red); border-color: var(--red); }

  /* ---- DAY GROUPS ---- */
  .rations-list { display: flex; flex-direction: column; gap: 10px; }
  .day-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
  }
  .day-group:hover { box-shadow: var(--shadow-lg); }

  .day-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .day-header:hover { background: var(--surface2); }
  .day-left { display: flex; align-items: center; gap: 12px; }
  .day-date-block { }
  .day-date-text { font-size: 15px; font-weight: 600; color: var(--text); }
  .day-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .progress-wrap { width: 56px; height: 4px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--green); border-radius: 999px; transition: width 0.4s ease; }
  .day-right { display: flex; align-items: center; gap: 6px; }
  .del-day-btn {
    width: 30px; height: 30px; border: none;
    background: transparent; border-radius: var(--radius-sm);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 15px; transition: all 0.15s;
  }
  .del-day-btn:hover { background: var(--red-soft); color: var(--red); }
  .chevron { font-size: 16px; color: var(--text3); transition: transform 0.2s; }
  .day-group.collapsed .chevron { transform: rotate(-90deg); }
  .day-group.collapsed .items-list { display: none; }

  .items-list { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  .item-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: var(--radius-sm);
    transition: background 0.1s;
  }
  .item-row:hover { background: var(--surface2); }

  .check-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .check-btn.taken { background: var(--green); border-color: var(--green); }
  .check-btn i { font-size: 14px; color: white; }

  .item-name {
    flex: 1; font-size: 14px; color: var(--text);
    transition: color 0.15s;
  }
  .item-name.taken { color: var(--text3); text-decoration: line-through; }

  .item-badge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    font-weight: 500; white-space: nowrap;
  }
  .item-badge.taken { background: var(--green-soft); color: var(--green); }
  .item-badge.remaining { background: var(--amber-soft); color: var(--amber); }

  .del-item-btn {
    background: none; border: none; cursor: pointer;
    font-size: 15px; color: var(--text3);
    padding: 5px; border-radius: var(--radius-sm);
    display: flex; align-items: center;
    transition: all 0.15s;
  }
  .del-item-btn:hover { background: var(--red-soft); color: var(--red); }

  /* ---- EMPTY ---- */
  .empty-state {
    text-align: center; padding: 48px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .empty-state i { font-size: 40px; color: var(--text3); display: block; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; color: var(--text2); }
  .empty-state small { font-size: 13px; color: var(--text3); margin-top: 4px; display: block; }

  /* ---- SHARE BAR ---- */
  .share-bar {
    display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap;
  }
  .share-btn {
    flex: 1; min-width: 120px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 13px; font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    color: var(--text2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: all 0.15s;
  }
  .share-btn:hover { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent); }
  .share-btn i { font-size: 16px; }
  .clear-all-btn {
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 13px; font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    color: var(--text3); cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: all 0.15s;
  }
  .clear-all-btn:hover { background: var(--red-soft); border-color: var(--red); color: var(--red); }

  /* ---- TOAST ---- */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: #1A1714; color: white;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    padding: 11px 20px; border-radius: 999px;
    display: flex; align-items: center; gap: 8px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 999; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast i { font-size: 15px; color: #97C459; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-basket"></i></div>
      <div>
        <h1>Ration Tracker</h1>
        <p id="storageLabel">0 items tracked</p>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-sub">items</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Taken</div>
        <div class="stat-value" id="statTaken">0</div>
        <div class="stat-sub">collected</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Remaining</div>
        <div class="stat-value" id="statRem">0</div>
        <div class="stat-sub">pending</div>
      </div>
    </div>
  </div>
</div>

<div class="main">

  <div class="add-card">
    <div class="add-card-title"><i class="ti ti-circle-plus"></i> Add new item</div>
    <div class="row2">
      <div class="field">
        <label>Date</label>
        <input type="date" id="inDate">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="inStatus">
          <option value="false">Remaining</option>
          <option value="true">Taken</option>
        </select>
      </div>
    </div>
    <div class="name-row">
      <div class="field">
        <label>Item name</label>
        <input type="text" id="inName" placeholder="e.g. Basmati Rice, Sugar, Oil…">
      </div>
      <button class="add-btn" onclick="addItem()"><i class="ti ti-plus"></i> Add</button>
    </div>
  </div>

  <div class="quick-section">
    <div class="section-label">Quick add</div>
    <div class="pills" id="quickPills"></div>
  </div>

  <div class="list-head">
    <div class="section-label">Your list</div>
    <div class="filter-wrap">
      <input type="date" id="filterDate" class="filter-input" oninput="render()">
      <button class="clear-filter-btn" onclick="clearFilter()" title="Clear filter"><i class="ti ti-x" style="font-size:15px"></i></button>
    </div>
  </div>

  <div class="rations-list" id="rationsList"></div>

  <div class="share-bar">
    <button class="share-btn" onclick="copyList()"><i class="ti ti-copy"></i> Copy list</button>
    <button class="share-btn" onclick="shareList()"><i class="ti ti-share"></i> Share</button>
    <button class="clear-all-btn" onclick="clearAll()" title="Delete all data"><i class="ti ti-trash"></i> Clear all</button>
  </div>

</div>

<div class="toast" id="toast"><i class="ti ti-check"></i> <span id="toastMsg"></span></div>

<script>
  const QUICK_ITEMS = ['Rice','Dal','Oil','Sugar','Wheat','Salt','Flour','Lentils','Tea','Ghee'];
  let rations = [];

  function load() {
    try { rations = JSON.parse(localStorage.getItem('rationTracker_v3') || '[]'); } catch(e) { rations = []; }
    if (!rations.length) {
      const today = new Date().toISOString().split('T')[0];
      rations = [
        { id: uid(), date: today, name: 'Basmati Rice', taken: false },
        { id: uid(), date: today, name: 'Toor Dal', taken: true },
      ];
      save();
    }
  }

  function save() {
    localStorage.setItem('rationTracker_v3', JSON.stringify(rations));
  }

  function uid() {
    return Date.now() + '-' + Math.random().toString(36).substr(2, 6);
  }

  function setToday() {
    document.getElementById('inDate').value = new Date().toISOString().split('T')[0];
  }

  function addItem() {
    const date = document.getElementById('inDate').value;
    const name = document.getElementById('inName').value.trim();
    const taken = document.getElementById('inStatus').value === 'true';
    if (!date || !name) { showToast('Please fill in date and item name'); return; }
    rations.push({ id: uid(), date, name, taken });
    save(); render();
    document.getElementById('inName').value = '';
    showToast('"' + name + '" added');
  }

  function quickAdd(name) {
    const date = document.getElementById('inDate').value;
    if (!date) { showToast('Pick a date first'); return; }
    rations.push({ id: uid(), date, name, taken: false });
    save(); render();
    showToast(name + ' added');
  }

  function toggle(id) {
    const r = rations.find(x => x.id === id);
    if (r) { r.taken = !r.taken; save(); render(); }
  }

  function deleteItem(id) {
    rations = rations.filter(x => x.id !== id);
    save(); render(); showToast('Item removed');
  }

  function deleteDay(date) {
    const n = rations.filter(x => x.date === date).length;
    if (!confirm('Delete all ' + n + ' items for this day?')) return;
    rations = rations.filter(x => x.date !== date);
    save(); render(); showToast(n + ' items removed');
  }

  function clearAll() {
    if (!confirm('Delete ALL rations? This cannot be undone.')) return;
    rations = []; save(); render(); showToast('All data cleared');
  }

  function clearFilter() {
    document.getElementById('filterDate').value = '';
    render();
  }

  function updateStats(list) {
    const taken = list.filter(r => r.taken).length;
    document.getElementById('statTotal').textContent = list.length;
    document.getElementById('statTaken').textContent = taken;
    document.getElementById('statRem').textContent = list.length - taken;
    document.getElementById('storageLabel').textContent = rations.length + ' item' + (rations.length !== 1 ? 's' : '') + ' tracked';
  }

  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function esc(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  function render() {
    const fDate = document.getElementById('filterDate').value;
    const list = fDate ? rations.filter(r => r.date === fDate) : rations;
    updateStats(list);

    const grouped = {};
    list.forEach(r => { (grouped[r.date] = grouped[r.date] || []).push(r); });
    const dates = Object.keys(grouped).sort().reverse();

    const el = document.getElementById('rationsList');
    if (!dates.length) {
      el.innerHTML = '<div class="empty-state"><i class="ti ti-clipboard-list"></i><p>No rations found</p><small>Add your first item using the form above</small></div>';
      return;
    }

    el.innerHTML = dates.map(date => {
      const items = grouped[date];
      const taken = items.filter(r => r.taken).length;
      const pct = items.length ? Math.round(taken / items.length * 100) : 0;

      const rows = [...items].sort((a, b) => a.taken - b.taken).map(r => `
        <div class="item-row">
          <button class="check-btn ${r.taken ? 'taken' : ''}" onclick="toggle('${r.id}')" aria-label="${r.taken ? 'Mark as remaining' : 'Mark as taken'}">
            ${r.taken ? '<i class="ti ti-check"></i>' : ''}
          </button>
          <span class="item-name ${r.taken ? 'taken' : ''}">${esc(r.name)}</span>
          <span class="item-badge ${r.taken ? 'taken' : 'remaining'}">${r.taken ? 'Taken' : 'Remaining'}</span>
          <button class="del-item-btn" onclick="deleteItem('${r.id}')" aria-label="Delete ${esc(r.name)}"><i class="ti ti-x"></i></button>
        </div>`).join('');

      return `
        <div class="day-group">
          <div class="day-header" onclick="toggleGroup(this.parentElement)">
            <div class="day-left">
              <div class="day-date-block">
                <div class="day-date-text">${formatDate(date)}</div>
                <div class="day-meta">${taken} of ${items.length} taken</div>
              </div>
              <div class="progress-wrap">
                <div class="progress-bar" style="width:${pct}%"></div>
              </div>
            </div>
            <div class="day-right">
              <button class="del-day-btn" onclick="event.stopPropagation();deleteDay('${date}')" aria-label="Delete day"><i class="ti ti-trash"></i></button>
              <i class="ti ti-chevron-down chevron"></i>
            </div>
          </div>
          <div class="items-list">${rows}</div>
        </div>`;
    }).join('');
  }

  function toggleGroup(el) { el.classList.toggle('collapsed'); }

  function buildText(formatted) {
    if (!rations.length) return 'No items in ration list.';
    const grouped = {};
    rations.forEach(r => { (grouped[r.date] = grouped[r.date] || []).push(r); });
    const dates = Object.keys(grouped).sort();
    let out = formatted ? '📋 *MY RATION LIST*\n━━━━━━━━━━━━━━━━━\n\n' : 'MY RATION LIST:\n\n';
    for (const d of dates) {
      const items = grouped[d];
      const taken = items.filter(r => r.taken).length;
      out += (formatted ? '📅 ' : '') + formatDate(d) + ' — ' + taken + '/' + items.length + ' taken\n';
      items.forEach(r => { out += '   ' + (r.taken ? '✅' : '❌') + ' ' + r.name + '\n'; });
      out += '\n';
    }
    if (formatted) {
      const t = rations.length, tk = rations.filter(r => r.taken).length;
      out += '━━━━━━━━━━━━━━━━━\n📊 Total: ' + tk + '/' + t + ' taken';
    }
    return out;
  }

  async function copyList() {
    const text = buildText(false);
    try {
      await navigator.clipboard.writeText(text);
    } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    showToast('List copied to clipboard');
  }

  async function shareList() {
    const text = buildText(true);
    if (navigator.share) {
      try { await navigator.share({ title: 'My Ration List', text }); return; }
      catch(e) { if (e.name === 'AbortError') return; }
    }
    copyList();
  }

  function showToast(msg, dur = 2600) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove('show'), dur);
  }

  document.getElementById('inName').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  document.getElementById('quickPills').innerHTML = QUICK_ITEMS.map(i =>
    `<button class="pill" onclick="quickAdd('${i}')">${i}</button>`).join('');

  setToday();
  load();
  render();
</script>
</body>
</html>
